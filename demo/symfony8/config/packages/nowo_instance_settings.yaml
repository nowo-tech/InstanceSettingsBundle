# Demo only: the admin UI is open without login (allow_unauthenticated is refused unless kernel.debug is true).
# Production: keep allow_unauthenticated false, protect web_ui.path_prefix with security.access_control and set
# security.access_roles (see docs/CONFIGURATION.md).
nowo_instance_settings:
    doctrine:
        table_prefix: 'demo_'
    web_ui:
        path_prefix: /admin/settings
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: true
        # 1.15: the SMS provider token is declared revealable, so a reveal rate limiter is required (the container
        # refuses to build a revealable secret without one). In a real host, reveal_roles keeps the action for
        # ROLE_DEVELOPER; here allow_unauthenticated already opens the whole UI (dev / demo only).
        reveal_roles: [ROLE_DEVELOPER]
        reveal_rate_limiter: limiter.instance_settings_reveal
    portability:
        sealed_secrets: true
        max_upload_bytes: 1048576
    # Image fields (1.4) and their crop step (1.8): the site logo is cropped in the browser (UiKit image crop) before
    # it is uploaded; the server still checks and re-encodes it.
    files:
        enabled: true
    # 1.17: expiry dates of the secret fields declaring expires: true (the SMS auth token). Maps the
    # demo_instance_setting_secret_expiry table (the entrypoint runs doctrine:schema:update).
    expiring_secrets:
        enabled: true
