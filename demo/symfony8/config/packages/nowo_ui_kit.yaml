# REQ-DEMO-014: UiKit's default theme, unchanged (no CSS framework, no CDN). The demo shell (templates/base.html.twig,
# UiKit's demo platform layout) is the admin and guest layout of the bundle pages.
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    base_stylesheet: true
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
