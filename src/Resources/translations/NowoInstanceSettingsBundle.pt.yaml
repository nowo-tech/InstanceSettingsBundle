settings:
  title: Definições
  intro: Definições de toda a instância. As alterações aplicam-se no pedido seguinte, sem deploy.
  empty: Ainda não há nenhuma secção de definições registada.
  empty_title: Ainda não há nada para configurar
  save: Guardar
  portability: Importar / exportar
flash:
  saved: Definições guardadas.
  unchanged: Nada foi alterado.
portability:
