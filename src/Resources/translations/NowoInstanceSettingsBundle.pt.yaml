    dry_run: Apenas validar (simulação)
    submit: Importar
    done: 'Configuração importada: %count% valor(es) alterado(s).'
    dry_run_ok: 'Ficheiro válido: seriam aplicados %count% valor(es). Nada foi escrito.'
