brand:
  group:
    identity: Identidade
    logos: Logótipos
    extra_images: Imagens adicionais
    advanced: Avançado
  section:
    label: Marca
    intro: Nome, textos e imagens desta instância. As imagens são PNG, JPEG ou WebP (sem envio de SVG), recodificadas no envio e servidas publicamente.
  field:
    name: Nome
    short_name: Nome curto
    eyebrow: Sobretítulo
    wordmark: Logótipo de texto
    logo_light: Logótipo (fundos claros)
    logo_dark: Logótipo (fundos escuros)
    mark: Símbolo da marca
    app_icon: Ícone da app
    favicon: Favicon
    extra: Imagem adicional
  help:
    name: Mostrado no cabeçalho, nos títulos, nos e-mails e no manifesto da app. No máximo 80 caracteres.
    short_name: No máximo 12 caracteres (etiqueta no ecrã inicial). Vazio = o nome cortado a 12.
    eyebrow: Linha curta acima do nome. Vazio = o valor configurado.
    wordmark: Forma de texto do logótipo. Vazio = o nome em minúsculas.
    logo_light: Logótipo horizontal para fundos claros, no máximo 2400 × 800 px. Vazio = o configurado ou, se não houver, o nome.
    logo_dark: O mesmo logótipo para fundos escuros. Vazio = o logótipo claro.
    mark: Símbolo quadrado de 64 a 1024 px (menu de ícones, telemóveis, PDF). Vazio = o ícone da app.
    app_icon: Quadrado, opaco, pelo menos 512 × 512 px; são geradas versões de 512, 192 e 180 px. Vazio = um símbolo quadrado de 512 px ou mais.
    favicon: Quadrado, pelo menos 32 × 32 px; são geradas versões de 32 e 16 px. Vazio = o símbolo e depois o ícone da app.
