  intro: Copie a configuração da instância entre ambientes como um ficheiro JSON versionado.
  back: Voltar às definições
  export:
    title: Exportar
    intro: Descarrega todas as definições portáteis. Os segredos nunca são exportados.
    intro_secrets: 'Descarrega todas as definições portáteis. Os segredos ficam de fora, a menos que os inclua selados: só uma instância com a mesma chave de cifra os pode importar.'
