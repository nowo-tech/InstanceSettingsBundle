    missing_file: Escolha um ficheiro JSON.
    too_large: O ficheiro é demasiado grande.
    invalid_json: O ficheiro não é JSON válido.
    not_an_object: O ficheiro deve conter um objeto JSON.
    invalid_schema: O ficheiro não é uma exportação de definições da instância (esquema errado).
    invalid_version: O ficheiro não tem uma versão válida.
    unsupported_version: Esta versão de exportação não é suportada.
    unknown_key: 'Chave desconhecida: %key%.'
    empty_payload: O ficheiro não contém nada para importar.
    invalid_settings: O bloco "settings" é inválido.
    unknown_section: 'Secção desconhecida: %key%.'
    invalid_section: 'Secção inválida: %key%.'
    secret_in_clear: 'Os segredos só são aceites selados: %key%.'
    not_portable: 'Esta definição não pode ser importada: %key%.'
    invalid_value: Valor inválido para %key%.
    sealed_secrets_disabled: Os segredos selados estão desativados nesta instância.
    invalid_secrets: O bloco "secrets" é inválido.
