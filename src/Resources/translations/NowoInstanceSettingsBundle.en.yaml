settings:
  title: Settings
  intro: Instance-wide settings. Changes apply on the next request, without a deploy.
  empty: No settings section is registered yet.
  empty_title: Nothing to configure yet
  save: Save
  portability: Import / export
flash:
  saved: Settings saved.
  unchanged: Nothing changed.
notice:
  hidden_secret_invalid: "The settings were not saved. The secret typed for “%field%” is not valid: %message% Its provider is not selected, so the field is hidden: select that provider to correct it, or leave it blank."
  hidden_secrets_dropped: "Secrets typed for a provider that is not selected are not saved: select the provider first, then type its secret."
portability:
  title: Import / export
  intro: Copy the instance configuration between environments as a versioned JSON file.
  back: Back to the settings
  export:
    title: Export
    intro: Downloads every portable setting. Secrets are never exported.
    intro_secrets: 'Downloads every portable setting. Secrets are left out unless you include them sealed: only an instance with the same encryption key can import them.'
    include_secrets: Include the secrets, sealed with this instance key
    include_secrets_help: 'Keep the file private: anyone holding it and this instance key can read the secrets.'
    include_files: 'Include the images of image fields'
    include_files_help: 'Adds the stored images (base64), so the file can be large.'
    submit: Download JSON
  import:
    title: Import
    intro: 'The whole file is validated before anything is written: a refused file changes nothing.'
    file: Configuration file (JSON)
    file_help: An export of this bundle with the same schema.
    dry_run: Only validate (dry run)
    submit: Import
    done: 'Configuration imported: %count% value(s) changed.'
    dry_run_ok: 'Valid file: %count% value(s) would be applied. Nothing was written.'
  error:
    missing_file: Choose a JSON file.
    too_large: The file is too large.
    invalid_json: The file is not valid JSON.
    not_an_object: The file must contain a JSON object.
    invalid_schema: The file is not an instance settings export (wrong schema).
    invalid_version: The file has no valid version.
    unsupported_version: This export version is not supported.
    unknown_key: 'Unknown key: %key%.'
    empty_payload: The file contains nothing to import.
    invalid_settings: The "settings" block is invalid.
    unknown_section: 'Unknown section: %key%.'
    invalid_section: 'Invalid section: %key%.'
    secret_in_clear: 'Secrets are only accepted sealed: %key%.'
    not_portable: 'This setting cannot be imported: %key%.'
    invalid_value: Invalid value for %key%.
    sealed_secrets_disabled: Sealed secrets are disabled on this instance.
    invalid_secrets: The "secrets" block is invalid.
    invalid_sealed_secret: 'Invalid sealed secret: %key%.'
    failed_unseal_secret: 'The secrets were sealed by another instance (different encryption key): %key%.'
    invalid_providers: The "providers" block is invalid.
    forbidden_key: 'Credential-like key refused: %key%.'
    export_failed: The export failed.
    seal_failed: A secret could not be sealed.
    forbidden_section: 'You may not change this section: %key%.'
    secret_context_mismatch: 'The sealed secret belongs to another field or application: %key%.'
    unsupported_encryptor: Sealed secrets need an authenticated encryption profile (Halite or Defuse), not MysqlAes.
    invalid_files: 'The "files" block is invalid.'
    invalid_file: 'Not an accepted image: %key%.'
    file_too_large: 'The image is too large: %key%.'
    files_too_large: 'The images are larger than this instance accepts in one file.'
    file_hash_mismatch: 'The image does not match its declared hash: %key%.'
    missing_image_file: 'The image is missing from the file: %key%.'
    unexpected_file: 'This image does not match a setting of the file: %key%.'
image:
  upload: 'Upload an image (PNG, JPEG or WebP)'
  replace: 'Replace the stored image'
  remove: 'Remove the stored image'
color:
  reset: 'Use the preset colour'
brand:
  section:
    label: Brand
    intro: Name, texts and images of this instance. Images are PNG, JPEG or WebP (no SVG upload), re-encoded on upload and served publicly.
  field:
    name: Name
    short_name: Short name
    eyebrow: Eyebrow
    wordmark: Wordmark
    logo_light: Logo (light backgrounds)
    logo_dark: Logo (dark backgrounds)
    mark: Brand mark
    app_icon: App icon
    favicon: Favicon
    extra: Extra image
  help:
    name: Shown in the header, page titles, e-mails and the app manifest. At most 80 characters.
    short_name: At most 12 characters (home screen label). Empty = the name cut at 12.
    eyebrow: Short line above the name. Empty = the configured default.
    wordmark: Text form of the logo. Empty = the name in lower case.
    logo_light: Horizontal logo for light backgrounds, at most 2400 × 800 px. Empty = the configured default, else the name.
    logo_dark: Same logo for dark backgrounds. Empty = the light logo.
    mark: Square mark, 64 to 1024 px (icons-only menu, phones, PDFs). Empty = the app icon.
    app_icon: Square, opaque, at least 512 × 512 px; 512, 192 and 180 px versions are generated. Empty = a square mark of 512 px or more.
    favicon: Square, at least 32 × 32 px; 32 and 16 px versions are generated. Empty = the mark, then the app icon.
appearance:
  section:
    label: Appearance
    intro: Colours and layout of the interface. An empty colour follows the selected preset.
  field:
    preset: Preset (light mode)
    preset_dark: Preset (dark mode)
    light_accent: 'Light: accent'
    light_accent_deep: 'Light: deep accent'
    light_danger: 'Light: danger'
    light_warn: 'Light: warning'
    light_paper: 'Light: page background'
    light_ink: 'Light: text'
    light_surface: 'Light: surface'
    dark_accent: 'Dark: accent'
    dark_accent_deep: 'Dark: deep accent'
    dark_danger: 'Dark: danger'
    dark_warn: 'Dark: warning'
    dark_paper: 'Dark: page background'
    dark_ink: 'Dark: text'
    dark_surface: 'Dark: surface'
    corner_style: Corner style
    border_strength: Border strength
    footer_fixed: Fixed footer
  help:
    preset: Colours left empty in light mode follow this preset.
    preset_dark: Colours left empty in dark mode follow this preset.
    color: '#rrggbb. Empty = the colour of the selected preset.'
    corner_style: sharp, soft or rounded.
    border_strength: subtle, medium or strong.
    footer_fixed: Keep the footer visible at the bottom of the window.
  contrast:
    light:
      text_on_paper: 'Light mode: text on the page background is below WCAG AA contrast (4.5:1).'
      text_on_surface: 'Light mode: text on the surface is below WCAG AA contrast (4.5:1).'
      primary_contrast_on_primary: 'Light mode: text on the accent colour is below WCAG AA contrast (4.5:1).'
      primary_on_surface: 'Light mode: the accent colour on the surface is below 3:1 contrast (WCAG 1.4.11).'
    dark:
      text_on_paper: 'Dark mode: text on the page background is below WCAG AA contrast (4.5:1).'
      text_on_surface: 'Dark mode: text on the surface is below WCAG AA contrast (4.5:1).'
      primary_contrast_on_primary: 'Dark mode: text on the accent colour is below WCAG AA contrast (4.5:1).'
      primary_on_surface: 'Dark mode: the accent colour on the surface is below 3:1 contrast (WCAG 1.4.11).'
