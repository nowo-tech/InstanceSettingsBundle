image:
  upload: 'Een afbeelding uploaden (PNG, JPEG of WebP)'
  replace: 'Opgeslagen afbeelding vervangen'
  remove: 'Opgeslagen afbeelding verwijderen'
brand:
  section:
    label: Merk
    intro: Naam, teksten en afbeeldingen van deze instantie. Afbeeldingen zijn PNG, JPEG of WebP (geen SVG-upload), worden bij het uploaden opnieuw gecodeerd en openbaar aangeboden.
  field:
    name: Naam
    short_name: Korte naam
    eyebrow: Bovenregel
    wordmark: Woordmerk
    logo_light: Logo (lichte achtergronden)
    logo_dark: Logo (donkere achtergronden)
    mark: Merkteken
    app_icon: App-pictogram
    favicon: Favicon
    extra: Extra afbeelding
  help:
    name: Getoond in de kop, paginatitels, e-mails en het app-manifest. Maximaal 80 tekens.
    short_name: Maximaal 12 tekens (label op het startscherm). Leeg = de naam ingekort tot 12.
    eyebrow: Korte regel boven de naam. Leeg = de ingestelde waarde.
    wordmark: Tekstvorm van het logo. Leeg = de naam in kleine letters.
    logo_light: Liggend logo voor lichte achtergronden, maximaal 2400 × 800 px. Leeg = het ingestelde, anders de naam.
    logo_dark: Hetzelfde logo voor donkere achtergronden. Leeg = het lichte logo.
    mark: Vierkant teken van 64 tot 1024 px (pictogrammenmenu, telefoons, pdf's). Leeg = het app-pictogram.
    app_icon: Vierkant, dekkend, minstens 512 × 512 px; versies van 512, 192 en 180 px worden gemaakt. Leeg = een vierkant teken van 512 px of meer.
    favicon: Vierkant, minstens 32 × 32 px; versies van 32 en 16 px worden gemaakt. Leeg = het teken, daarna het app-pictogram.
