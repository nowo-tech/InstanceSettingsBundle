settings:
  title: Paramètres
  intro: Paramètres de toute l'instance. Les changements s'appliquent à la requête suivante, sans déploiement.
  empty: Aucune section de paramètres n'est encore enregistrée.
  empty_title: Rien à configurer pour le moment
  save: Enregistrer
  portability: Import / export
flash:
  saved: Paramètres enregistrés.
  unchanged: Rien n'a changé.
notice:
  hidden_secrets_dropped: "Les secrets saisis pour un fournisseur non sélectionné ne sont pas enregistrés : sélectionnez d’abord le fournisseur, puis saisissez son secret."
portability:
  title: Import / export
  intro: Copiez la configuration de l'instance entre environnements sous forme de fichier JSON versionné.
  back: Retour aux paramètres
  export:
    title: Exporter
    intro: Télécharge tous les paramètres portables. Les secrets ne sont jamais exportés.
    intro_secrets: 'Télécharge tous les paramètres portables. Les secrets sont omis sauf si vous les incluez scellés : seule une instance avec la même clé de chiffrement peut les importer.'
    include_secrets: Inclure les secrets, scellés avec la clé de cette instance
    include_secrets_help: 'Gardez le fichier privé : toute personne qui le détient avec la clé de cette instance peut lire les secrets.'
    include_files: 'Inclure les images des champs image'
    include_files_help: 'Ajoute les images enregistrées (base64) : le fichier peut être volumineux.'
    submit: Télécharger le JSON
  import:
    title: Importer
    intro: 'Tout le fichier est validé avant toute écriture : un fichier refusé ne change rien.'
    file: Fichier de configuration (JSON)
    file_help: Un export de ce bundle avec le même schéma.
    dry_run: Valider seulement (simulation)
    submit: Importer
    done: 'Configuration importée : %count% valeur(s) modifiée(s).'
    dry_run_ok: 'Fichier valide : %count% valeur(s) seraient appliquées. Rien n''a été écrit.'
  error:
    missing_file: Choisissez un fichier JSON.
    too_large: Le fichier est trop volumineux.
    invalid_json: Le fichier n'est pas un JSON valide.
    not_an_object: Le fichier doit contenir un objet JSON.
    invalid_schema: Le fichier n'est pas un export de paramètres d'instance (mauvais schéma).
    invalid_version: Le fichier n'a pas de version valide.
    unsupported_version: Cette version d'export n'est pas prise en charge.
    unknown_key: 'Clé inconnue : %key%.'
    empty_payload: Le fichier ne contient rien à importer.
    invalid_settings: Le bloc « settings » est invalide.
    unknown_section: 'Section inconnue : %key%.'
    invalid_section: 'Section invalide : %key%.'
    secret_in_clear: 'Les secrets ne sont acceptés que scellés : %key%.'
    not_portable: 'Ce paramètre ne peut pas être importé : %key%.'
    invalid_value: Valeur invalide pour %key%.
    sealed_secrets_disabled: Les secrets scellés sont désactivés sur cette instance.
    invalid_secrets: Le bloc « secrets » est invalide.
    invalid_sealed_secret: 'Secret scellé invalide : %key%.'
    failed_unseal_secret: 'Les secrets ont été scellés par une autre instance (autre clé de chiffrement) : %key%.'
    invalid_providers: Le bloc « providers » est invalide.
    forbidden_key: 'Clé ressemblant à un identifiant refusée : %key%.'
    export_failed: L'export a échoué.
    seal_failed: Un secret n'a pas pu être scellé.
    forbidden_section: 'Vous ne pouvez pas modifier cette section : %key%.'
    secret_context_mismatch: 'Le secret scellé appartient à un autre champ ou à une autre application : %key%.'
    unsupported_encryptor: Les secrets scellés exigent un profil de chiffrement authentifié (Halite ou Defuse), pas MysqlAes.
    invalid_files: 'Le bloc « files » est invalide.'
    invalid_file: 'Image non acceptée : %key%.'
    file_too_large: 'L''image est trop lourde : %key%.'
    files_too_large: 'Les images dépassent ce que cette instance accepte dans un fichier.'
    file_hash_mismatch: 'L''image ne correspond pas à son empreinte déclarée : %key%.'
    missing_image_file: 'L''image manque dans le fichier : %key%.'
    unexpected_file: 'Cette image ne correspond à aucun réglage du fichier : %key%.'
image:
  upload: 'Téléverser une image (PNG, JPEG ou WebP)'
  replace: 'Remplacer l''image enregistrée'
  remove: 'Supprimer l''image enregistrée'
brand:
  section:
    label: Marque
    intro: Nom, textes et images de cette instance. Les images sont en PNG, JPEG ou WebP (pas d'envoi SVG), réencodées à l'envoi et servies publiquement.
  field:
    name: Nom
    short_name: Nom court
    eyebrow: Surtitre
    wordmark: Logotype texte
    logo_light: Logo (fonds clairs)
    logo_dark: Logo (fonds sombres)
    mark: Symbole de marque
    app_icon: Icône de l'application
    favicon: Favicon
    extra: Image supplémentaire
  help:
    name: Affiché dans l'en-tête, les titres, les e-mails et le manifeste de l'application. 80 caractères au plus.
    short_name: 12 caractères au plus (libellé de l'écran d'accueil). Vide = le nom coupé à 12.
    eyebrow: Ligne courte au-dessus du nom. Vide = la valeur configurée.
    wordmark: Forme texte du logo. Vide = le nom en minuscules.
    logo_light: Logo horizontal pour fonds clairs, 2400 × 800 px au plus. Vide = celui configuré, sinon le nom.
    logo_dark: Le même logo pour fonds sombres. Vide = le logo clair.
    mark: Symbole carré de 64 à 1024 px (menu d'icônes, mobiles, PDF). Vide = l'icône de l'application.
    app_icon: Carré, opaque, au moins 512 × 512 px ; des versions de 512, 192 et 180 px sont générées. Vide = un symbole carré de 512 px ou plus.
    favicon: Carré, au moins 32 × 32 px ; des versions de 32 et 16 px sont générées. Vide = le symbole, puis l'icône de l'application.
appearance:
  section:
    label: Apparence
    intro: Couleurs et mise en page de l'interface. Une couleur vide suit le thème choisi.
  field:
    preset: Thème (mode clair)
    preset_dark: Thème (mode sombre)
    light_accent: 'Clair: accent'
    light_accent_deep: 'Clair: accent foncé'
    light_danger: 'Clair: danger'
    light_warn: 'Clair: avertissement'
    light_paper: 'Clair: fond de page'
    light_ink: 'Clair: texte'
    light_surface: 'Clair: surface'
    dark_accent: 'Sombre: accent'
    dark_accent_deep: 'Sombre: accent foncé'
    dark_danger: 'Sombre: danger'
    dark_warn: 'Sombre: avertissement'
    dark_paper: 'Sombre: fond de page'
    dark_ink: 'Sombre: texte'
    dark_surface: 'Sombre: surface'
    corner_style: Angles
    border_strength: Intensité des bordures
    footer_fixed: Pied de page fixe
  help:
    preset: Les couleurs vides du mode clair suivent ce thème.
    preset_dark: Les couleurs vides du mode sombre suivent ce thème.
    color: '#rrggbb. Vide = la couleur du thème choisi.'
    corner_style: sharp, soft ou rounded.
    border_strength: subtle, medium ou strong.
    footer_fixed: Garde le pied de page visible en bas de la fenêtre.
  contrast:
    light:
      text_on_paper: 'Mode clair: le texte sur le fond de page n''atteint pas le contraste WCAG AA (4,5:1).'
      text_on_surface: 'Mode clair: le texte sur la surface n''atteint pas le contraste WCAG AA (4,5:1).'
      primary_contrast_on_primary: 'Mode clair: le texte sur la couleur d''accent n''atteint pas le contraste WCAG AA (4,5:1).'
      primary_on_surface: 'Mode clair: la couleur d''accent sur la surface n''atteint pas 3:1 (WCAG 1.4.11).'
    dark:
      text_on_paper: 'Mode sombre: le texte sur le fond de page n''atteint pas le contraste WCAG AA (4,5:1).'
      text_on_surface: 'Mode sombre: le texte sur la surface n''atteint pas le contraste WCAG AA (4,5:1).'
      primary_contrast_on_primary: 'Mode sombre: le texte sur la couleur d''accent n''atteint pas le contraste WCAG AA (4,5:1).'
      primary_on_surface: 'Mode sombre: la couleur d''accent sur la surface n''atteint pas 3:1 (WCAG 1.4.11).'
