brand:
  group:
    identity: Identità
    logos: Loghi
    extra_images: Immagini aggiuntive
    advanced: Avanzate
  section:
    label: Marchio
    intro: Nome, testi e immagini di questa istanza. Le immagini sono PNG, JPEG o WebP (niente caricamento SVG), ricodificate al caricamento e servite pubblicamente.
  field:
    name: Nome
    short_name: Nome breve
    eyebrow: Occhiello
    wordmark: Logotipo testuale
    logo_light: Logo (sfondi chiari)
    logo_dark: Logo (sfondi scuri)
    mark: Simbolo del marchio
    app_icon: Icona dell'app
    favicon: Favicon
    extra: Immagine aggiuntiva
  help:
    name: Mostrato nell'intestazione, nei titoli, nelle e-mail e nel manifest dell'app. Al massimo 80 caratteri.
    short_name: Al massimo 12 caratteri (etichetta nella schermata home). Vuoto = il nome tagliato a 12.
    eyebrow: Riga breve sopra il nome. Vuoto = il valore configurato.
    wordmark: Forma testuale del logo. Vuoto = il nome in minuscolo.
    logo_light: Logo orizzontale per sfondi chiari, al massimo 2400 × 800 px. Vuoto = quello configurato, altrimenti il nome.
    logo_dark: Lo stesso logo per sfondi scuri. Vuoto = il logo chiaro.
    mark: Simbolo quadrato da 64 a 1024 px (menu a icone, telefoni, PDF). Vuoto = l'icona dell'app.
    app_icon: Quadrata, opaca, almeno 512 × 512 px; vengono generate versioni da 512, 192 e 180 px. Vuoto = un simbolo quadrato di almeno 512 px.
    favicon: Quadrata, almeno 32 × 32 px; vengono generate versioni da 32 e 16 px. Vuoto = il simbolo, poi l'icona dell'app.
