  field:
    preset: Tema (modo claro)
    preset_dark: Tema (modo oscuro)
    light_accent: 'Claro: acento'
    light_accent_deep: 'Claro: acento oscuro'
    light_danger: 'Claro: peligro'
    light_warn: 'Claro: aviso'
    light_paper: 'Claro: fondo de página'
    light_ink: 'Claro: texto'
    light_surface: 'Claro: superficie'
    dark_accent: 'Oscuro: acento'
    dark_accent_deep: 'Oscuro: acento oscuro'
    dark_danger: 'Oscuro: peligro'
    dark_warn: 'Oscuro: aviso'
    dark_paper: 'Oscuro: fondo de página'
    dark_ink: 'Oscuro: texto'
    dark_surface: 'Oscuro: superficie'
    corner_style: Esquinas
    border_strength: Intensidad del borde
    footer_fixed: Pie fijo
  help:
    preset: Los colores vacíos del modo claro siguen este tema.
    preset_dark: Los colores vacíos del modo oscuro siguen este tema.
    color: '#rrggbb. Vacío = el color del tema seleccionado.'
    corner_style: sharp, soft o rounded.
    border_strength: subtle, medium o strong.
    footer_fixed: Mantiene el pie visible en la parte inferior de la ventana.
