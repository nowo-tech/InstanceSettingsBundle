image:
  upload: 'Subir una imagen (PNG, JPEG o WebP)'
  replace: 'Sustituir la imagen guardada'
  remove: 'Quitar la imagen guardada'
brand:
  section:
    label: Marca
    intro: Nombre, textos e imágenes de esta instancia. Las imágenes son PNG, JPEG o WebP (no se sube SVG), se recodifican al subirlas y se sirven públicamente.
  field:
    name: Nombre
    short_name: Nombre corto
    eyebrow: Antetítulo
    wordmark: Logotipo de texto
    logo_light: Logo (fondos claros)
    logo_dark: Logo (fondos oscuros)
    mark: Símbolo de marca
    app_icon: Icono de la app
    favicon: Favicon
    extra: Imagen adicional
  help:
    name: Se muestra en la cabecera, los títulos, los correos y el manifiesto de la app. Máximo 80 caracteres.
    short_name: Máximo 12 caracteres (etiqueta en la pantalla de inicio). Vacío = el nombre cortado a 12.
    eyebrow: Línea corta sobre el nombre. Vacío = el valor configurado.
    wordmark: Forma de texto del logo. Vacío = el nombre en minúsculas.
    logo_light: Logo horizontal para fondos claros, máximo 2400 × 800 px. Vacío = el configurado o, si no hay, el nombre.
    logo_dark: El mismo logo para fondos oscuros. Vacío = el logo claro.
    mark: Símbolo cuadrado de 64 a 1024 px (menú de iconos, móviles, PDF). Vacío = el icono de la app.
    app_icon: Cuadrado, opaco, mínimo 512 × 512 px; se generan versiones de 512, 192 y 180 px. Vacío = un símbolo cuadrado de 512 px o más.
    favicon: Cuadrado, mínimo 32 × 32 px; se generan versiones de 32 y 16 px. Vacío = el símbolo y luego el icono de la app.
