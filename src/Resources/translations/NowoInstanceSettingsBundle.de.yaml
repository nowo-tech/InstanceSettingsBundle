settings:
  title: Einstellungen
  intro: Instanzweite Einstellungen. Änderungen gelten ab der nächsten Anfrage, ohne Deployment.
  empty: Es ist noch kein Einstellungsbereich registriert.
  empty_title: Noch nichts zu konfigurieren
  save: Speichern
  portability: Import / Export
flash:
  saved: Einstellungen gespeichert.
  unchanged: Nichts geändert.
notice:
  hidden_secret_invalid: "Die Einstellungen wurden nicht gespeichert. Das für „%field%“ eingegebene Geheimnis ist ungültig: %message% Sein Anbieter ist nicht ausgewählt, daher ist das Feld ausgeblendet: Wählen Sie diesen Anbieter, um es zu korrigieren, oder lassen Sie es leer."
  hidden_secrets_dropped: "Geheimnisse, die für einen nicht ausgewählten Anbieter eingegeben werden, werden nicht gespeichert: Wählen Sie zuerst den Anbieter und geben Sie dann sein Geheimnis ein."
portability:
  title: Import / Export
  intro: Kopieren Sie die Instanzkonfiguration als versionierte JSON-Datei zwischen Umgebungen.
  back: Zurück zu den Einstellungen
  export:
    title: Exportieren
    intro: Lädt alle portablen Einstellungen herunter. Geheimnisse werden nie exportiert.
    intro_secrets: 'Lädt alle portablen Einstellungen herunter. Geheimnisse werden ausgelassen, außer Sie fügen sie versiegelt hinzu: Nur eine Instanz mit demselben Schlüssel kann sie importieren.'
    include_secrets: Geheimnisse einschließen, mit dem Schlüssel dieser Instanz versiegelt
    include_secrets_help: 'Halten Sie die Datei privat: Wer sie und den Schlüssel dieser Instanz besitzt, kann die Geheimnisse lesen.'
    include_files: 'Bilder der Bildfelder einschließen'
    include_files_help: 'Fügt die gespeicherten Bilder (Base64) hinzu, die Datei kann daher groß werden.'
    submit: JSON herunterladen
  import:
    title: Importieren
    intro: 'Die ganze Datei wird geprüft, bevor etwas geschrieben wird: Eine abgelehnte Datei ändert nichts.'
    file: Konfigurationsdatei (JSON)
    file_help: Ein Export dieses Bundles mit demselben Schema.
    dry_run: Nur prüfen (Probelauf)
    submit: Importieren
    done: 'Konfiguration importiert: %count% Wert(e) geändert.'
    dry_run_ok: 'Gültige Datei: %count% Wert(e) würden übernommen. Es wurde nichts geschrieben.'
