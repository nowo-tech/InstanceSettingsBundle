image:
  upload: 'Bild hochladen (PNG, JPEG oder WebP)'
  replace: 'Gespeichertes Bild ersetzen'
  remove: 'Gespeichertes Bild entfernen'
brand:
  section:
    label: Marke
    intro: Name, Texte und Bilder dieser Instanz. Bilder sind PNG, JPEG oder WebP (kein SVG-Upload), werden beim Hochladen neu kodiert und öffentlich ausgeliefert.
  field:
    name: Name
    short_name: Kurzname
    eyebrow: Dachzeile
    wordmark: Wortmarke
    logo_light: Logo (helle Hintergründe)
    logo_dark: Logo (dunkle Hintergründe)
    mark: Markenzeichen
    app_icon: App-Symbol
    favicon: Favicon
    extra: Zusätzliches Bild
  help:
    name: Erscheint in der Kopfzeile, in Seitentiteln, E-Mails und im App-Manifest. Höchstens 80 Zeichen.
    short_name: Höchstens 12 Zeichen (Beschriftung auf dem Startbildschirm). Leer = der Name, auf 12 gekürzt.
    eyebrow: Kurze Zeile über dem Namen. Leer = der konfigurierte Wert.
    wordmark: Textform des Logos. Leer = der Name in Kleinbuchstaben.
    logo_light: Querformat-Logo für helle Hintergründe, höchstens 2400 × 800 px. Leer = das konfigurierte, sonst der Name.
    logo_dark: Dasselbe Logo für dunkle Hintergründe. Leer = das helle Logo.
    mark: Quadratisches Zeichen, 64 bis 1024 px (Symbolmenü, Smartphones, PDF). Leer = das App-Symbol.
    app_icon: Quadratisch, deckend, mindestens 512 × 512 px; Versionen mit 512, 192 und 180 px werden erzeugt. Leer = ein quadratisches Zeichen ab 512 px.
    favicon: Quadratisch, mindestens 32 × 32 px; Versionen mit 32 und 16 px werden erzeugt. Leer = das Zeichen, dann das App-Symbol.
